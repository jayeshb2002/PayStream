services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: paystream-kafka
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: paystream-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paystream}
      POSTGRES_USER: ${POSTGRES_USER:-paystream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paystream_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paystream} -d ${POSTGRES_DB:-paystream}"]
      interval: 5s
      timeout: 3s
      retries: 20

  airflow-db:
    image: postgres:16-alpine
    container_name: paystream-airflow-db
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_dev_password}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: ${AIRFLOW_IMAGE_NAME:-paystream-airflow:2.10.5-python3.11}
    container_name: paystream-airflow-init
    profiles: ["airflow"]
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow_dev_password}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-paystream-local-secret-change-me}
      PYTHONPATH: /opt/airflow
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-paystream_admin_password}
      PAYSTREAM_DB_HOST: ${PAYSTREAM_DB_HOST:-postgres}
      PAYSTREAM_DB_PORT: ${PAYSTREAM_DB_PORT:-5432}
      PAYSTREAM_DB_NAME: ${PAYSTREAM_DB_NAME:-paystream}
      PAYSTREAM_DB_USER: ${PAYSTREAM_DB_USER:-paystream}
      PAYSTREAM_DB_PASSWORD: ${PAYSTREAM_DB_PASSWORD}
      DATA_QUALITY_THRESHOLD: ${DATA_QUALITY_THRESHOLD:-95}
    user: "${AIRFLOW_UID:-50000}:0"
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./models:/opt/airflow/models
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create
          --username "$${_AIRFLOW_WWW_USER_USERNAME}"
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}"
          --firstname PayStream
          --lastname Admin
          --role Admin
          --email admin@paystream.local || echo "Admin user may already exist")
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: ${AIRFLOW_IMAGE_NAME:-paystream-airflow:2.10.5-python3.11}
    container_name: paystream-airflow-webserver
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    user: "${AIRFLOW_UID:-50000}:0"
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: ${AIRFLOW_IMAGE_NAME:-paystream-airflow:2.10.5-python3.11}
    container_name: paystream-airflow-scheduler
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    user: "${AIRFLOW_UID:-50000}:0"
    volumes: *airflow-volumes
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard

    container_name: paystream-dashboard

    restart: unless-stopped

    ports:
      - "${DASHBOARD_PORT:-8501}:8501"

    environment:
      PAYSTREAM_DB_HOST: postgres
      PAYSTREAM_DB_PORT: 5432
      PAYSTREAM_DB_NAME: ${PAYSTREAM_DB_NAME:-paystream}
      PAYSTREAM_DB_USER: ${PAYSTREAM_DB_USER:-paystream}
      PAYSTREAM_DB_PASSWORD: ${PAYSTREAM_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS_HOST: kafka
      KAFKA_BOOTSTRAP_SERVERS_PORT: 9092

      AIRFLOW_DB_HOST: airflow-db
      AIRFLOW_DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - default


volumes:
  kafka_data:
  postgres_data:
  airflow-db-data:
